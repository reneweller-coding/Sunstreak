# Sunstreak for Windows and Linux, built on GitHub's runners.
#
# A tag v* or "Run workflow" by hand: Release builds with the tests, packed as Sunstreak-<version>-windows-x64.zip
# (MSVC, static runtime) and Sunstreak-<version>-linux-x86_64.tar.gz (GCC 12 on Ubuntu 22.04, so it runs on glibc 2.35
# and newer, SteamOS included), kept as the run's artifacts and, for a tag, attached to its release where it lacks
# them: Deploy/publish_release.ps1 publishes the archives built locally by Deploy/build_release.ps1, and this run is
# the check that the tag builds and passes its tests on clean machines. raylib and SDL2 are fetched by CMake.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Configure and build (Release)
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64
          cmake --build build --config Release --parallel

      - name: Tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Pack
        shell: pwsh
        run: |
          $version = (Select-String -Path CMakeLists.txt -Pattern 'project\( Sunstreak VERSION ([0-9.]+)').Matches[0].Groups[1].Value
          $name = "Sunstreak-$version-windows-x64"
          New-Item -ItemType Directory -Force "stage/$name", dist | Out-Null
          Copy-Item build/Release/Sunstreak.exe, README.md, LICENSE, docs/manual/Sunstreak-Manual.pdf, docs/CREDITS.txt, docs/OFL-Noto.txt "stage/$name"
          Compress-Archive -Path "stage/$name/*" -DestinationPath "dist/$name.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.zip

  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: The packages GLFW needs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++-12 libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev libxext-dev libgl1-mesa-dev

      - name: Build, test, pack
        env:
          CC: gcc-12
          CXX: g++-12
        run: bash Deploy/build_linux.sh "$PWD/build"

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --title "Sunstreak ${GITHUB_REF_NAME#v}" --generate-notes
          # Only what the release lacks: the assets published with Deploy/publish_release.ps1 (and their checksums)
          # stay; this build is then the check that the tag builds and passes its tests on clean machines.
          for f in dist/*; do
            gh release upload "$GITHUB_REF_NAME" "$f" -R "$GITHUB_REPOSITORY" || echo "kept the release's own $(basename "$f")"
          done
